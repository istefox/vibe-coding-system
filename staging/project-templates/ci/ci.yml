# CI template (ADR-0022 D8) — dropped into a target repo as .github/workflows/ci.yml.
#
# The __TEST_CMD__ token is substituted by autopilot at drop time with the target
# repo's TOFU-trusted command from .claude/test-cmd (fallback documented if absent).
# The job name `ci` is the required status check that set-branch-protection.sh enforces on
# main — keep the two in sync. No secrets are needed for a static build.
#
# TWO JOBS, TWO POSTURES (ADR-0054, issue #108). `ci` runs the project's own tests plus two
# ADVISORY reporters that never fail the build. `checks`, below, is a SEPARATE job that runs the
# same reporter scripts FAIL-CLOSED against the PR diff, plus the interface-immutability checker.
# Splitting them matters for branch protection (ADR-0054 §D2): folding a heuristic or a
# secret-scan false positive into `ci` would make "a gate fired" indistinguishable from "the tests
# broke". A repo can require `checks` on main independently of `ci`.
#
# VENDORING IS MANUAL AND DELIBERATE, AND DRIFTS (ADR-0054 §D3/§D4). Every `.claude/scripts/*.sh`
# referenced below must be copied into the target repo by hand, once, with
# `vendor-checks.sh <repo-root> --apply` (`staging/plugin/scripts/vendor-checks.sh` in the
# vibe-coding-system blueprint repo, deployed to `~/.claude/hooks/vendor-checks.sh`). Nothing here
# fetches them at CI time — that would make a project's security gates depend on an external
# service being up and honest. Until vendored, every gate step below is INERT: the `[ -x … ]`
# guard turns a missing script into a visible skip notice, never a silent pass. The copies do not
# refresh themselves; re-run vendor-checks.sh by hand when the source scripts change upstream, and
# expect them to be stale most of the time — that is the accepted cost, not a bug.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add stack setup here if the test command needs a toolchain, e.g.:
      #   - uses: actions/setup-node@v4
      #     with: { node-version: '20' }
      #   - uses: actions/setup-python@v5
      #     with: { python-version: '3.12' }

      - name: Run tests
        run: __TEST_CMD__

      # --- Advisory pre-merge reporters (ADR-0046 §D10, issue #100) ---------------------------
      # Both scripts exit 0 on a completed scan, findings or not, so a finding is printed in the
      # log and this `ci` check stays green. Turning a finding into a red build is the FAIL-CLOSED
      # `checks` job below (issue #108 / ADR-0054) — the SAME scripts, called a second time with
      # the opposite posture, never modified to get there (ADR-0054 §D1).
      #
      # INERT UNTIL VENDORED, by design (ADR-0054 §D4): nothing copies secret-scan.sh and
      # dependency-scan.sh into a target repo's .claude/scripts/ automatically — that is a
      # deliberate manual step, `vendor-checks.sh <repo-root> --apply`. Until it is run, both
      # steps below are INERT. The `[ -x … ]` guard is what makes them inert rather than red, and
      # the skip notice makes the inertness visible in the CI log instead of silent.

      - name: Secret scan (advisory)
        run: |
          if [ -x .claude/scripts/secret-scan.sh ]; then
            # Whole tree, so no base ref and no fetch-depth change to the checkout above.
            # Identical behaviour on push and pull_request.
            git ls-files | .claude/scripts/secret-scan.sh --files -
          else
            echo "::notice::.claude/scripts/secret-scan.sh not present — secret scan skipped (issue #108 vendors it)"
          fi

      - name: Dependency scan (advisory)
        run: |
          if [ -x .claude/scripts/dependency-scan.sh ]; then
            # A dependency check needs a diff by definition. Resolve the base ref, verify a merge
            # base exists, and skip with a notice otherwise — never a hard failure on a shallow
            # clone or on a push build, which has no base ref at all.
            base="${GITHUB_BASE_REF:-}"
            if [ -z "$base" ]; then
              echo "::notice::no base ref (push build) — dependency scan needs a diff, skipped"
            else
              git fetch --no-tags --depth=50 origin "$base" >/dev/null 2>&1 || true
              mb=$(git merge-base "origin/$base" HEAD 2>/dev/null || true)
              if [ -z "$mb" ]; then
                echo "::notice::no merge base with origin/$base (shallow clone?) — dependency scan skipped"
              else
                git diff "$mb" HEAD | .claude/scripts/dependency-scan.sh --diff
              fi
            fi
          else
            echo "::notice::.claude/scripts/dependency-scan.sh not present — dependency scan skipped (issue #108 vendors it)"
          fi

  # ================================================================================================
  # checks — a SEPARATE job from `ci` (ADR-0054 §D2, issue #108). Runs the SAME four scripts as
  # `ci`'s advisory reporters plus interface-check.sh, but FAIL-CLOSED against the PR diff. `ci`
  # is the required status check `set-branch-protection.sh` enforces on main; a repo opts `checks`
  # into branch protection independently, so a gate firing here never reads as "the tests broke".
  #
  # THE POSTURE BELONGS TO THE CALLER, NOT THE SCRIPT (ADR-0054 §D1). secret-scan.sh,
  # dependency-scan.sh and weakening-scan.sh are REPORTERS — they always exit 0 and signal through
  # stdout only, exactly as ADR-0046/ADR-0047/ADR-0051 shipped them, because a false positive at
  # the HOOK call site blocks an agent mid-run with no human present (fail-open there). Here, a
  # false positive is a red build on a PR a human is already reading (fail-closed here). None of
  # the four scripts below are modified to make this job possible — this job is the caller that
  # turns a mechanical finding into a build failure instead of the script doing it.
  #
  # WHAT FAILS THE BUILD, WHAT ONLY PRINTS (ADR-0054 §D5) — mechanical vs. heuristic:
  #   SECRET (secret-scan.sh)             -> FAILS the build
  #   WEAKENED (weakening-scan.sh)        -> FAILS the build
  #   interface-check.sh exit 3           -> FAILS the build (it is a CHECKER: the caller
  #                                           branches on its exit code, not on stdout)
  #   SUSPECT (weakening-scan.sh)         -> print-only (heuristic; ADR-0051 measured
  #                                           literal-assertion-added at 25% precision)
  #   NEWDEP notes (dependency-scan.sh)   -> print-only (no allow-list means "report everything")
  # A `checks` job that fires on heuristics is a `checks` job someone adds to the ignore list.
  #
  # REPORTER TRAP, RESTATED AT EVERY CALL SITE BELOW (ADR-0054 §D6, the exact bug issue #100 hit):
  # never `[ -n "$out" ]` to decide whether something was found — that is true even on a bare
  # CLEAN sentinel. Never `n=$(... | grep -c '^X' ... || echo 0)` — `grep -c ... || echo 0` prints
  # 0 AND exits 1 on no match, so the fallback ALSO fires, yielding the two-line string "0\n0".
  # Use `printf '%s\n' "$out" | grep -q '^PATTERN'`, and `grep -c ... || true` if a count is ever
  # genuinely needed.
  #
  # INERT UNTIL VENDORED (ADR-0054 §D4): every step is `[ -x .claude/scripts/<name> ]`-guarded and
  # prints a skip notice naming `vendor-checks.sh` as the remedy when the script is absent — a
  # skipped step and a passing step must never look the same in this log.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Diff-scoped gates need the merge base with the PR's target branch, which a shallow
          # (depth-1, the actions/checkout default) clone does not carry on the HEAD side. Full
          # history here; each step below additionally fetches the base ref itself, following
          # dependency-scan.sh's existing base-ref/merge-base pattern in the `ci` job above.
          fetch-depth: 0

      - name: Secret scan (fail-closed)
        run: |
          if [ -x .claude/scripts/secret-scan.sh ]; then
            # Whole tree, so no base ref needed — identical behaviour on push and pull_request,
            # matching the advisory step in the `ci` job above.
            out=$(git ls-files | .claude/scripts/secret-scan.sh --files -)
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -q '^SECRET'; then
              echo "::error::secret-scan.sh reported a SECRET finding — see the log above"
              exit 1
            fi
          else
            echo "::notice::.claude/scripts/secret-scan.sh not present — run vendor-checks.sh to enable this gate (issue #108)"
          fi

      - name: Dependency scan (print-only)
        run: |
          if [ -x .claude/scripts/dependency-scan.sh ]; then
            base="${GITHUB_BASE_REF:-}"
            if [ -z "$base" ]; then
              echo "::notice::no base ref (push build) — dependency scan needs a diff, skipped"
            else
              git fetch --no-tags --depth=50 origin "$base" >/dev/null 2>&1 || true
              mb=$(git merge-base "origin/$base" HEAD 2>/dev/null || true)
              if [ -z "$mb" ]; then
                echo "::notice::no merge base with origin/$base (shallow clone?) — dependency scan skipped"
              else
                # Print-only (ADR-0054 §D5): a NEWDEP finding never fails this job, regardless of
                # what the pipeline's own exit status would otherwise be.
                git diff "$mb" HEAD | .claude/scripts/dependency-scan.sh --diff || true
              fi
            fi
          else
            echo "::notice::.claude/scripts/dependency-scan.sh not present — run vendor-checks.sh to enable this gate (issue #108)"
          fi

      - name: Weakening scan (fail-closed)
        run: |
          if [ -x .claude/scripts/weakening-scan.sh ]; then
            base="${GITHUB_BASE_REF:-}"
            if [ -z "$base" ]; then
              echo "::notice::no base ref (push build) — weakening scan needs a diff, skipped"
            else
              git fetch --no-tags --depth=50 origin "$base" >/dev/null 2>&1 || true
              mb=$(git merge-base "origin/$base" HEAD 2>/dev/null || true)
              if [ -z "$mb" ]; then
                echo "::notice::no merge base with origin/$base (shallow clone?) — weakening scan skipped"
              else
                out=$(git diff "$mb" HEAD | .claude/scripts/weakening-scan.sh)
                printf '%s\n' "$out"
                if printf '%s\n' "$out" | grep -q '^WEAKENED'; then
                  echo "::error::weakening-scan.sh reported a WEAKENED finding — see the log above"
                  exit 1
                fi
                # SUSPECT is print-only, deliberately never reaches this branch (ADR-0054 §D5,
                # ADR-0051's measured 25% precision on literal-assertion-added).
              fi
            fi
          else
            echo "::notice::.claude/scripts/weakening-scan.sh not present — run vendor-checks.sh to enable this gate (issue #108)"
          fi

      # interface-check.sh is a CHECKER, not a reporter — unlike the three steps above, the caller
      # branches on its exit code, not on stdout (ADR-0053 §D2/§D3). Moved here from `ci` (was
      # issue #107's original step) so a broken protected interface reads as "a gate fired"
      # (checks) rather than "the tests broke" (ci) in branch protection (ADR-0054 §D2).
      # `--no-renames` is required (ADR-0053): git's default rename detection can collapse a
      # same-content file move into a rename record with no content lines at all, which would hide
      # a path-glob relocation from this purely textual checker.
      - name: Interface immutability gate (fail-closed)
        run: |
          if [ -x .claude/scripts/interface-check.sh ]; then
            base="${GITHUB_BASE_REF:-}"
            if [ -z "$base" ]; then
              echo "::notice::no base ref (push build) — interface check needs a diff, skipped"
            else
              git fetch --no-tags --depth=50 origin "$base" >/dev/null 2>&1 || true
              mb=$(git merge-base "origin/$base" HEAD 2>/dev/null || true)
              if [ -z "$mb" ]; then
                echo "::notice::no merge base with origin/$base (shallow clone?) — interface check skipped"
              else
                # No `|| true`, no grep on stdout: exit 3 (a broken protected interface) is meant
                # to propagate straight into this step's — and this job's — result.
                git diff --no-renames "$mb" HEAD | .claude/scripts/interface-check.sh --root .
              fi
            fi
          else
            echo "::notice::.claude/scripts/interface-check.sh not present — run vendor-checks.sh to enable this gate (issue #108)"
          fi

  # ================================================================================================
  # security-audit — a THIRD job, separate from `ci` and `checks` (ADR-0056, issue #110). Opt-in:
  # SAST is irrelevant to some target repos (a docs repo, a shell-script repo) and adds real
  # runtime, so the whole job is inert unless the target repo commits the opt-in marker file
  # `.claude/security-audit-enabled` (ADR-0053 §D1 shape: presence is the opt-in, absence is
  # inert — no `publish: true`-style key needed because there is nothing else to configure).
  #
  # THE SEMGREP VERSION PIN IS LOAD-BEARING, NOT HYGIENE (ADR-0056 §D2). ADR-0039 §D4 removed
  # linters from the write path because "a verdict that depends on which tools are installed is
  # not a verdict" (shellcheck's SC2148 was invisible on macOS, red on CI — real evidence). Semgrep
  # is that class of tool. What makes this job legitimate instead of a reversal of that rule is: a
  # declared runner PLUS a pinned Semgrep version PLUS a pinned ruleset — two runs of the same
  # commit agree. Tagging the image below with the floating "most recent build" tag would
  # reintroduce exactly the non-determinism ADR-0039 removed, one registry push at a time.
  #
  # DO NOT CHANGE THE IMAGE TAG BELOW TO A FLOATING TAG, AND DO NOT REPLACE THE NAMED RULESET
  # BELOW WITH THE DYNAMIC PER-LANGUAGE AUTO-DETECT MODE. Both are the pin. The version will go
  # stale (ADR-0056 Consequences, negative) — that is the accepted cost of determinism; re-pin by
  # hand when the ruleset needs new rule classes, the same drift ADR-0054 §D3 already accepted for
  # the vendored check scripts.
  #
  # ERROR BLOCKS, WARNING AND INFO PRINT (ADR-0056 §D3, same evidence-quality split as ADR-0054
  # §D5). A job that fires on INFO is a job someone adds to the ignore list, and the ERROR
  # findings go unread with it.
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.170.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Presence-based opt-in (ADR-0053 §D1 shape): the marker carries no keys because there is
      # nothing else to configure. Every later step in this job is gated on this output, never on
      # a job-level `if:`, so a repo that has not opted in gets one cheap notice step instead of a
      # job GitHub reports as skipped-with-no-explanation.
      - name: Opt-in check
        id: optin
        run: |
          if [ -f .claude/security-audit-enabled ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::.claude/security-audit-enabled not present — security-audit is opt-in, skipping (ADR-0056)"
          fi

      - name: Semgrep scan (pinned ruleset)
        if: steps.optin.outputs.enabled == 'true'
        run: |
          # Named published pack, never the dynamic auto-detect config mode — that mode resolves
          # rules per language at scan time, which is one more axis of non-determinism this job
          # exists to remove (ADR-0056 §D2).
          semgrep scan --config=p/owasp-top-ten --json --output=semgrep-results.json .

      - name: Semgrep findings — ERROR blocks, WARNING/INFO print (ADR-0056 §D3)
        if: steps.optin.outputs.enabled == 'true'
        run: |
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json)
          warnings=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' semgrep-results.json)
          infos=$(jq '[.results[] | select(.extra.severity == "INFO")] | length' semgrep-results.json)

          echo "Semgrep findings — ERROR: $errors  WARNING: $warnings  INFO: $infos"

          # WARNING and INFO print only — never fail the build (ADR-0056 §D3, the same
          # evidence-quality split ADR-0054 §D5 draws between mechanical and heuristic findings).
          # Semgrep's default ERROR-severity rules are high-confidence; WARNING/INFO carry the
          # false-positive rate that would get this job added to the ignore list.
          if [ "$warnings" -gt 0 ] || [ "$infos" -gt 0 ]; then
            echo "::notice::$warnings WARNING and $infos INFO finding(s) — printed, never block the build"
            jq -r '.results[] | select(.extra.severity == "WARNING" or .extra.severity == "INFO") | "\(.extra.severity): \(.path):\(.start.line) \(.check_id)"' semgrep-results.json
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors ERROR-severity Semgrep finding(s) — see the job log above"
            jq -r '.results[] | select(.extra.severity == "ERROR") | "\(.path):\(.start.line) \(.check_id) — \(.extra.message)"' semgrep-results.json
            exit 1
          fi

  # ================================================================================================
  # licence-scan — a FOURTH job, separate from ci/checks/security-audit (ADR-0065, issue #119).
  # Follows security-audit's shape (ADR-0056, issue #110) EXACTLY — do not invent a second pattern:
  # separate job, opt-in via a repo marker, pinned tool version. Opt-in because a licence scan is
  # irrelevant to a private single-author repo and adds real runtime, same reasoning as
  # security-audit.
  #
  # THE VERSION PIN IS LOAD-BEARING FOR THE SAME REASON AS security-audit's (ADR-0056 §D2, applies
  # UNCHANGED per ADR-0065 §D1): a declared runner plus a pinned tool version is what makes two
  # runs of the same commit agree. An unpinned scanner reintroduces exactly the machine-dependent
  # verdict ADR-0039 §D4 removed. DO NOT CHANGE THE IMAGE TAG BELOW TO `:latest` OR ANY FLOATING
  # TAG. Pinned to 7.2.1, the most recent stable semantic-version release verified on Docker Hub at
  # authoring time (not a fabricated digest — see the plan for how this was established).
  #
  # REPORTS; NEVER BLOCKS (ADR-0065 §D3) — unlike security-audit's ERROR-blocks/WARNING-INFO-prints
  # split, NO branch in this job may exit non-zero on a finding. A licence scanner reports what a
  # dependency DECLARES, and declarations are frequently wrong, missing, or dual; treating that as
  # a merge gate would block on metadata quality, not on legal risk.
  #
  # NOT LEGAL ADVICE, AND THIS JOB CANNOT SEE THE RISK THE FEATURE ACTUALLY NAMES (ADR-0065 §D4). A
  # scanner finding is an input to a human decision about licensing, never a determination. A green
  # run of this job does not mean the tree is clean or compliant — it means declared dependency
  # metadata showed nothing. It reports what a dependency declares; it cannot see verbatim
  # reproduction of an unattributed snippet, which is the risk this feature exists to address. That
  # risk stays a documented human procedure in clean-public-repo's audit phase (ADR-0065 §D2) — a
  # judgement about distinctiveness plus a network search, neither reproducible here — never a job
  # in this file.
  licence-scan:
    name: licence-scan
    runs-on: ubuntu-latest
    container:
      image: licensefinder/license_finder:7.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Presence-based opt-in (ADR-0053 §D1 shape, same as security-audit): the marker carries no
      # keys, nothing else to configure. Gated on this output at every later step, never a
      # job-level `if:`, so a repo that has not opted in gets one cheap notice step instead of a
      # job GitHub reports as skipped-with-no-explanation.
      - name: Opt-in check
        id: optin
        run: |
          if [ -f .claude/licence-scan-enabled ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::.claude/licence-scan-enabled not present — licence-scan is opt-in, skipping (ADR-0065)"
          fi

      - name: Licence scan (pinned tool, report-only, NOT LEGAL ADVICE)
        if: steps.optin.outputs.enabled == 'true'
        run: |
          echo "::notice::licence-scan reports DECLARED dependency metadata only. This is NOT LEGAL ADVICE: a finding here is an input to a human decision about licensing, never a determination. It cannot see verbatim reproduction of an unattributed snippet — that risk is a human procedure in clean-public-repo's audit phase (ADR-0065), not this job. This job never fails the build (ADR-0065 §D3): findings print here, they do not block."
          license_finder --format json > licence-results.json || true
          cat licence-results.json || true
