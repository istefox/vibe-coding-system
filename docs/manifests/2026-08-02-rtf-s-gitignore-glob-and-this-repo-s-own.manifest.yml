# Proportional audit depth (ADR-0055) — risk and task_type axes. Absent/null means STRICT
# here, not inert (inverts the ADR-0052/0053/0054 pattern) — see concept-to-code/SKILL.md
# section '#### Proportional audit depth' for the resolution rule and the §D4 floor.
risk: null
task_type: null

# External dependencies (ADR-0060 G13). Empty list means nobody declared any — NOT that
# none exist (§D5); the gate is inert on an empty list. This is the OPPOSITE default
# direction from risk/task_type above: those default to the strict profile on null because
# they REMOVE a leniency; this feature ADDS a constraint, so absent/empty must equal the
# pre-feature behaviour (ADR-0055 §D2's rule, applied here per ADR-0060). Populated at Gate
# 2c from the architect's EXTERNAL DEPENDENCY: lines, confirmed by the operator.
external_dependencies: []

# Per-task checkpoint review in Step 5 (ADR-0039 D5-D9). Opt-in: 'none' | 'checkpoint'.
# Flip with: sed -i '' 's/^step5_review_mode: none/step5_review_mode: checkpoint/' <manifest>
# (not manifest-set-flag.sh — that helper only accepts true|false, same as step5_mode)
step5_review_mode: none

# Tracer-bullet probe (ADR-0057, Step 4.5, optional, between Gate 4 and Step 5). Absent/skip
# means skipped — the OPPOSITE default direction from ADR-0055 §D2 (contrast: that feature
# REMOVES a constraint so it defaults strict; this feature ADDS a step so inert must equal
# the pre-feature behaviour). Flip with:
# sed -i '' 's/^tracer_bullet_mode: skip/tracer_bullet_mode: probe/' <manifest>
tracer_bullet_mode: skip
tracer_bullet_verdict: null
