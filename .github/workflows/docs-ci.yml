name: Docs CI

# This repo is documentation plus a small tree of shell scripts under staging/. The CI lints
# Markdown, checks links, and runs the offline shell harnesses so every PR gets a green/red
# check. Internal links (relative paths + anchors) block the build; external links run as a
# warning only to avoid rate-limit false fails.
# Actions are pinned to commit SHAs (same discipline as the other istefox repos).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a run only when a later push to the SAME pull request has superseded it. A run on `main`
# is never cancelled: two merges landing close together would otherwise leave the earlier one
# unvalidated, and "a check that did not run looks exactly like a check that found nothing" is the
# failure this repository keeps recording. Measured 2026-08-03: 21 pull_request events over 17
# branches, so 4 superseded runs in three days.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: "**/*.md"

  shell-tests:
    name: shell-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # zsh is a BUILD DEPENDENCY of this job, not a convenience (issue #394, ADR-0133 R-06/R-07).
      # fence-contract-coverage.test.sh's WSA/WSB take one wrapped population fence body, run it
      # under zsh AND under bash with the same fixture, and compare stdout and exit code — the
      # executed proof a structural check cannot give, because a guard cannot observe an interpreter
      # it does not invoke. With zsh absent both assertions FAIL with an explicit `ZSH-ABSENT`
      # message; there is no skip path, by design (ADR-0032's CI-dark class: a check that did not
      # run must never read as a check that found nothing). So deleting this step turns the job red
      # rather than quietly dropping the proof — the correct direction, and it will read as a
      # regression the first time. Keep it BEFORE the harness loop.
      - name: Install zsh (required by the WSA/WSB executed proof)
        run: |
          set -e
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          zsh --version

      # Offline, hermetic, no network. These harnesses pipe synthetic hook-event JSON into the
      # scripts and assert on the output. The scripts target bash 3.2 (macOS); the runner has
      # bash 5, which exercises the logic but not the 3.2 constraint. Keep them 3.2-clean by hand.
      - name: Run offline shell harnesses
        run: |
          set -e
          for t in phase1 prep hook-probe hook-verify-workflow pairs-completeness clean-public-repo-history-safety concept-to-code-bsd-autopilot-gates concept-to-code-manifest-helpers-guards scope-guards refactor-snapshot-deep-refactor claude-md-slim-content-union-whole-line hook-hardening skill-text-corrections agent-tool-scoping post-write-check step5-checkpoint-review step6-effort-pin workflow-dispatch-pins sync-manual-steps write-scope-enforce agent-write-scope agent-command-scope secret-dep-gate weakening-wiring spec-coverage test-write-scope recovery-preflight reward-hack-detectors diff-budget-scope interface-immutability project-ci-checks proportional-audit-depth sast-security-audit tracer-bullet-probe precompact-occupancy untrusted-input external-dependency-gate human-gate-coverage litter-discipline canonical-mechanism agent-metrics licence-provenance accessibility-i18n worktree-isolation-contract agent-tool-parameter-names plan-task-count pattern-enforce-transcript-source macos-detect manifest-field-state transcript-scan-rule manifest-project-root-terminal cross-reference-form fence-contract-coverage skill-coverage-perimeter triage-state-gitignore transition-producer spec-archive gate4-implementation-axes gate0-recommendation hitl-gate-audit-trail batch-dispatch-openers batch-boundary-precedence gate2b-trust-probe recovery-baseline-rebase step7-snapshot-collapse gate5-state-removal spec-pointer-archive manifest-entry-state permission-mode-state conductor-entry-failure-split autopilot-guard-disarm required-checks-audit transition-pair-count autopilot-run-scope skill-fence-positional-tokens prep-row-select commit-transition-order claude-md-condensation stop-gate-path-predicate dispatch-completion acceptance-contract; do
            printf '::group::%s\n' "$t"
            bash "staging/plugin/scripts/tests/$t.test.sh"
            printf '::endgroup::\n'
          done

      # The plant registry runs LAST and separately: it is not a *.test.sh, and it re-runs other
      # harnesses against mutated copies of the tree. A failure here means an assertion somewhere
      # pins nothing, which is a different signal from a harness going red.
      #
      # COST: 23m32s for 362 plants, measured on this runner in run 31879782795 (2026-08-15). The
      # note this replaces said "~12s for 15 plants" and had been true at 15. It is by far the
      # longest step in the workflow and it grows linearly with the registry — issue #350. Re-derive
      # the pair from a run rather than trusting this line; that it went stale once is the point.
      - name: Run the plant registry
        run: bash staging/plugin/scripts/tests/plant-check.sh

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Internal links: file paths and #anchors, resolved offline. A broken relative
      # link or dead anchor fails the build.
      - name: Internal links (blocking)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: "--offline --include-fragments --exclude-path docs/superpowers --no-progress '**/*.md'"
          fail: true

      # External links: real HTTP(S) targets. Reported in the job summary but never block,
      # so a rate-limited or temporarily-down host does not turn the PR red.
      - name: External links (warning only)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        continue-on-error: true
        with:
          args: "--scheme https --scheme http --exclude-path docs/superpowers --no-progress '**/*.md'"
          fail: true
