name: Docs CI

# This repo is documentation plus a small tree of shell scripts under staging/. The CI lints
# Markdown, checks links, and runs the offline shell harnesses so every PR gets a green/red
# check. Internal links (relative paths + anchors) block the build; external links run as a
# warning only to avoid rate-limit false fails.
# Actions are pinned to commit SHAs (same discipline as the other istefox repos).
#
# ADR-0193: `plant-shard` and `shell-tests` no longer run on `push` to `main` — that event fires
# after the merge has already landed, so the run can only ever be a diagnostic re-check, never a
# gate. `markdownlint` and `links` keep running on every push (cheap, and `links` is genuinely
# cross-PR: a merge can combine two individually-green PRs into a dead link). `workflow_dispatch`
# is the manual escape hatch to re-run full validation against `main` on demand.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel a run only when a later push to the SAME pull request has superseded it. A run on `main`
# is never cancelled: two merges landing close together would otherwise leave the earlier one
# unvalidated, and "a check that did not run looks exactly like a check that found nothing" is the
# failure this repository keeps recording. Measured 2026-08-03: 21 pull_request events over 17
# branches, so 4 superseded runs in three days.
# ADR-0193: this still applies to markdownlint/links, the only jobs that still run on `push` — the
# heavy jobs (plant-shard, shell-tests) are gated off `push` entirely (see their own `if:` below),
# so there's nothing left on `main` for this rule to protect for them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: "**/*.md"

  plant-shard:
    name: plant-shard
    runs-on: ubuntu-latest
    # ADR-0193: skipped on `push` — that event fires after the merge already landed, so this leg
    # can only ever be a diagnostic re-check. `shell-tests` below carries the EXACT same condition
    # on purpose: its `--require-legs` step fails the job on a `skipped` shard result, so a
    # mismatch here would turn `shell-tests` red on every merge. Re-run on demand via
    # `workflow_dispatch`.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false          # one broken plant must not cancel the other three and hide the rest
      matrix:
        shard: [1, 2, 3, 4]     # THE shard count lives here and nowhere else
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # VCS-051 / ADR-0180. Computed independently in every job that needs it, rather than a shared
      # `decide` job other jobs `needs:` — shell-tests' `needs: [plant-shard]` line is pinned
      # byte-for-byte by plant-registry-parallel.test.sh's PS11 and must not gain a second entry.
      # Duplicated per matrix leg here (cheap: a handful of git commands) rather than computed once
      # and passed in, for the same reason.
      - name: Decide CI tier
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          # Best-effort changed-file derivation: the checkout above is shallow (fetch-depth 1,
          # unchanged — widening it is out of scope here), so the SHAs this step needs are usually
          # not already present locally. Each branch does a bounded, targeted fetch for exactly the
          # SHA it needs (same pattern project-templates/ci/ci.yml's dependency-scan step already
          # uses) and treats a fetch/resolve failure as "cannot cleanly determine a base" rather
          # than an error — fail toward the expensive tier, never toward the cheap one.
          CHANGED=""; HAVE_BASE=0
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            git fetch --no-tags --depth=50 origin "$PR_BASE_SHA" "$PR_HEAD_SHA" >/dev/null 2>&1 || true
            if git cat-file -e "$PR_BASE_SHA" 2>/dev/null && git cat-file -e "$PR_HEAD_SHA" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null || true)
              HAVE_BASE=1
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE_SHA:-}" ] \
               && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=50 origin "$PUSH_BEFORE_SHA" >/dev/null 2>&1 || true
            if git cat-file -e "$PUSH_BEFORE_SHA" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$PUSH_BEFORE_SHA" HEAD 2>/dev/null || true)
              HAVE_BASE=1
            fi
          fi

          if [ "$HAVE_BASE" -eq 1 ] && [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED" >/tmp/ci-tier-changed.txt
            set +e
            CLASSIFY_OUT=$(bash staging/plugin/scripts/ci-tier.sh --classify /tmp/ci-tier-changed.txt 2>/tmp/ci-tier-classify.err)
            CLASSIFY_RC=$?
            set -e
            if [ "$CLASSIFY_RC" -eq 3 ]; then
              COMPUTED=full
              echo "::notice::ci-tier: $(cat /tmp/ci-tier-classify.err) — treating as full"
            else
              COMPUTED=$(printf '%s\n' "$CLASSIFY_OUT" | grep '^TIER: ' | head -1 | cut -d' ' -f2)
              [ -n "$COMPUTED" ] || COMPUTED=full
            fi
          else
            COMPUTED=full
            echo "::notice::ci-tier: could not determine a base for this $EVENT_NAME event (or no changed files) — treating as full"
          fi

          # The CI: trailer, read from the actually authored commit — $PR_HEAD_SHA for
          # pull_request (checkout's synthetic merge commit's OWN message is "Merge ... into ...",
          # never the trailer; $PR_HEAD_SHA is the real PR head commit's absolute SHA, already
          # fetched and cat-file-verified above for the changed-file diff, so no extra fetch is
          # needed here). HEAD^2 was tried first (VCS-053) and never resolves: the checkout above
          # is shallow (fetch-depth 1, no parent commits), so relative addressing through the
          # merge commit's un-fetched parent silently fails and falls back to the merge commit's
          # own message. HEAD directly for push. Falls back to full the same way an
          # absent/unparseable trailer already does.
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_HEAD_SHA:-}" ] && git cat-file -e "$PR_HEAD_SHA" 2>/dev/null; then
            TRAILER_SRC=$(git log -1 --format=%B "$PR_HEAD_SHA" 2>/dev/null || true)
          else
            TRAILER_SRC=$(git log -1 --format=%B HEAD 2>/dev/null || true)
          fi
          REQUESTED=$(printf '%s\n' "$TRAILER_SRC" | grep -oE '^CI: (docs|standard|full)$' | head -1 | cut -d' ' -f2)
          [ -n "$REQUESTED" ] || REQUESTED=full

          set +e
          RESOLVE_OUT=$(bash staging/plugin/scripts/ci-tier.sh --resolve "$REQUESTED" "$COMPUTED" 2>/tmp/ci-tier-resolve.err)
          set -e
          EFFECTIVE=$(printf '%s\n' "$RESOLVE_OUT" | grep '^TIER: ' | head -1 | cut -d' ' -f2)
          [ -n "$EFFECTIVE" ] || EFFECTIVE=full

          echo "::notice::CI tier — computed=$COMPUTED requested=$REQUESTED effective=$EFFECTIVE"
          [ -s /tmp/ci-tier-resolve.err ] && echo "::notice::$(cat /tmp/ci-tier-resolve.err)"

          echo "tier=$EFFECTIVE" >> "$GITHUB_OUTPUT"

      # The zsh step below is NOT copied here for symmetry with shell-tests' own install step: it is
      # a build dependency of THIS job specifically (issue #447, ADR-0151 §D8's "not copied for
      # symmetry" note). The registry re-runs fence-contract-coverage.test.sh's WSA/WSB under
      # mutation; with zsh absent both fail by design (ADR-0133), the baseline for that harness goes
      # red, and every plant declared in it becomes VACUOUS. Nothing but this comment says so.
      - name: Install zsh (a dependency of the harnesses this job re-runs under mutation)
        run: |
          set -e
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          zsh --version

      - name: Run the plant registry (shard ${{ matrix.shard }})
        if: steps.decide.outputs.tier == 'full'
        env:
          PLANT_SHARD: ${{ matrix.shard }}
          PLANT_SHARDS: ${{ strategy.job-total }}
          PLANT_ARTIFACT: ${{ runner.temp }}/plant-shard-${{ matrix.shard }}.tsv
        run: |
          echo "runner cores: $(nproc)"
          bash staging/plugin/scripts/tests/plant-check.sh

      - name: Upload this shard's verdict stream
        if: always()            # a RED shard's evidence is the evidence the union needs most
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/plant-shard-${{ matrix.shard }}.tsv

  shell-tests:
    name: shell-tests
    runs-on: ubuntu-latest
    needs: [plant-shard]
    # a failed shard must not skip the union: a required context that never reports leaves the
    # pull request pending forever (ADR-0151 §D8). ADR-0193: `&& github.event_name != 'push'` MUST
    # match plant-shard's own `if:` above exactly — plant-shard reports `skipped` on `push`, and
    # `--require-legs` below fails this job on a `skipped` shard result, so a mismatch here would
    # turn shell-tests red on every merge instead of skipped.
    if: always() && github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # VCS-051 / ADR-0180. Computed independently here rather than via `needs: decide` — this
      # job's `needs: [plant-shard]` line is pinned byte-for-byte by plant-registry-parallel.test.sh's
      # PS11 and must not gain a second entry. Identical derivation to the plant-shard job's own
      # step of the same name; both read the same commit, so both land on the same tier.
      - name: Decide CI tier
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -u
          CHANGED=""; HAVE_BASE=0
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            git fetch --no-tags --depth=50 origin "$PR_BASE_SHA" "$PR_HEAD_SHA" >/dev/null 2>&1 || true
            if git cat-file -e "$PR_BASE_SHA" 2>/dev/null && git cat-file -e "$PR_HEAD_SHA" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null || true)
              HAVE_BASE=1
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE_SHA:-}" ] \
               && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=50 origin "$PUSH_BEFORE_SHA" >/dev/null 2>&1 || true
            if git cat-file -e "$PUSH_BEFORE_SHA" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$PUSH_BEFORE_SHA" HEAD 2>/dev/null || true)
              HAVE_BASE=1
            fi
          fi

          if [ "$HAVE_BASE" -eq 1 ] && [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED" >/tmp/ci-tier-changed.txt
            set +e
            CLASSIFY_OUT=$(bash staging/plugin/scripts/ci-tier.sh --classify /tmp/ci-tier-changed.txt 2>/tmp/ci-tier-classify.err)
            CLASSIFY_RC=$?
            set -e
            if [ "$CLASSIFY_RC" -eq 3 ]; then
              COMPUTED=full
              echo "::notice::ci-tier: $(cat /tmp/ci-tier-classify.err) — treating as full"
            else
              COMPUTED=$(printf '%s\n' "$CLASSIFY_OUT" | grep '^TIER: ' | head -1 | cut -d' ' -f2)
              [ -n "$COMPUTED" ] || COMPUTED=full
            fi
          else
            COMPUTED=full
            echo "::notice::ci-tier: could not determine a base for this $EVENT_NAME event (or no changed files) — treating as full"
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_HEAD_SHA:-}" ] && git cat-file -e "$PR_HEAD_SHA" 2>/dev/null; then
            TRAILER_SRC=$(git log -1 --format=%B "$PR_HEAD_SHA" 2>/dev/null || true)
          else
            TRAILER_SRC=$(git log -1 --format=%B HEAD 2>/dev/null || true)
          fi
          REQUESTED=$(printf '%s\n' "$TRAILER_SRC" | grep -oE '^CI: (docs|standard|full)$' | head -1 | cut -d' ' -f2)
          [ -n "$REQUESTED" ] || REQUESTED=full

          set +e
          RESOLVE_OUT=$(bash staging/plugin/scripts/ci-tier.sh --resolve "$REQUESTED" "$COMPUTED" 2>/tmp/ci-tier-resolve.err)
          set -e
          EFFECTIVE=$(printf '%s\n' "$RESOLVE_OUT" | grep '^TIER: ' | head -1 | cut -d' ' -f2)
          [ -n "$EFFECTIVE" ] || EFFECTIVE=full

          echo "::notice::CI tier — computed=$COMPUTED requested=$REQUESTED effective=$EFFECTIVE"
          [ -s /tmp/ci-tier-resolve.err ] && echo "::notice::$(cat /tmp/ci-tier-resolve.err)"

          echo "tier=$EFFECTIVE" >> "$GITHUB_OUTPUT"

      # zsh is a BUILD DEPENDENCY of this job, not a convenience (issue #394, ADR-0133 R-06/R-07).
      # fence-contract-coverage.test.sh's WSA/WSB take one wrapped population fence body, run it
      # under zsh AND under bash with the same fixture, and compare stdout and exit code — the
      # executed proof a structural check cannot give, because a guard cannot observe an interpreter
      # it does not invoke. With zsh absent both assertions FAIL with an explicit `ZSH-ABSENT`
      # message; there is no skip path, by design (ADR-0032's CI-dark class: a check that did not
      # run must never read as a check that found nothing). So deleting this step turns the job red
      # rather than quietly dropping the proof — the correct direction, and it will read as a
      # regression the first time. Keep it BEFORE the harness loop.
      - name: Install zsh (required by the WSA/WSB executed proof)
        run: |
          set -e
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
          zsh --version

      # Offline, hermetic, no network. These harnesses pipe synthetic hook-event JSON into the
      # scripts and assert on the output. The scripts target bash 3.2 (macOS); the runner has
      # bash 5, which exercises the logic but not the 3.2 constraint. Keep them 3.2-clean by hand.
      - name: Run offline shell harnesses
        env:
          TIER: ${{ steps.decide.outputs.tier }}
        run: |
          set -e
          if [ "$TIER" != "docs" ]; then
            for t in phase1 prep hook-probe hook-verify-workflow pairs-completeness clean-public-repo-history-safety concept-to-code-bsd-autopilot-gates concept-to-code-manifest-helpers-guards scope-guards refactor-snapshot-deep-refactor claude-md-slim-content-union-whole-line hook-hardening skill-text-corrections agent-tool-scoping post-write-check step5-checkpoint-review step6-effort-pin workflow-dispatch-pins sync-manual-steps write-scope-enforce agent-write-scope agent-command-scope secret-dep-gate weakening-wiring spec-coverage test-write-scope recovery-preflight reward-hack-detectors diff-budget-scope interface-immutability project-ci-checks proportional-audit-depth sast-security-audit tracer-bullet-probe precompact-occupancy untrusted-input external-dependency-gate human-gate-coverage litter-discipline canonical-mechanism agent-metrics licence-provenance accessibility-i18n worktree-isolation-contract agent-tool-parameter-names plan-task-count pattern-enforce-transcript-source macos-detect manifest-field-state transcript-scan-rule manifest-project-root-terminal cross-reference-form fence-contract-coverage skill-coverage-perimeter triage-state-gitignore transition-producer spec-archive gate4-implementation-axes gate0-recommendation hitl-gate-audit-trail batch-dispatch-openers batch-boundary-precedence gate2b-trust-probe recovery-baseline-rebase step7-snapshot-collapse gate5-state-removal spec-pointer-archive manifest-entry-state permission-mode-state conductor-entry-failure-split autopilot-guard-disarm required-checks-audit transition-pair-count autopilot-run-scope skill-fence-positional-tokens prep-row-select commit-transition-order claude-md-condensation stop-gate-path-predicate dispatch-completion acceptance-contract plant-registry-parallel harness-helper-scope brief-to-app session-context-inject spec-coverage-baseline-bump autopilot-disarm-scope-preserve commit-outcome-backstop worktree-git-guardrail instructions-loaded tools-rule-evidence-anchors ci-tier ci-tier-workflow-decide claude-design-gate agent-memory-contract memory-store-guard reviewer-write-scope coder-memory-scope step5-brief use-codex-review-manifest-field codex-reviewer-schema coder-discipline codex-audit-mode codex-review-dispatch-gate codex-tester-dispatch-gate codex-coder-dispatch-gate; do
              printf '::group::%s\n' "$t"
              bash "staging/plugin/scripts/tests/$t.test.sh"
              printf '::endgroup::\n'
            done
          else
            echo "::notice::offline shell harnesses skipped (tier=docs)"
          fi

      # The plant registry no longer runs HERE: it runs SHARDED, in the plant-shard matrix job
      # above, on four separate machines (issue #447, ADR-0151). This job downloads each shard's
      # verdict-stream artifact, asserts every leg succeeded, then evaluates the union over the
      # concatenation — PC0, PC3, PC5b and Z1, the population assertions no single shard can
      # evaluate on its own slice, plus PC6 (coverage) and PC7 (imbalance), which only the union
      # can ask. A failure in any of the three steps below means an assertion somewhere pins
      # nothing, or a shard's slice was lost or duplicated — a different signal from a harness
      # going red.
      #
      # `if: always()` on this job (above, ADR-0151 §D8) is why it still runs when a shard goes
      # red — a required context that never reports leaves the pull request pending forever. The
      # download step's `continue-on-error: true` is the same idea one level down: a total absence
      # of artifacts must still reach the union, which is what reports exit 3.
      #
      # COST, and HOW IT WAS MEASURED, because the second part is what makes the first usable
      # (issue #447, ADR-0151 §D8). Projected critical path ~8.4 min against ~18 min sequential — a
      # projection from the local cost model scaled to the CI-measured sequential registry step
      # (15m16s), TO BE RE-DERIVED ON THE RUNNER, not trusted. This comment has gone stale twice
      # already (ADR-0143, then again by this rewrite); re-measure with a run rather than repeat
      # the number here a third time.
      - name: Download every shard's verdict stream
        if: steps.decide.outputs.tier == 'full'
        continue-on-error: true   # a total absence must reach the union, which reports exit 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: plant-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/plant-shards

      - name: Require every plant-shard leg to have succeeded
        if: steps.decide.outputs.tier == 'full'
        env:
          SHARD_RESULT: ${{ needs.plant-shard.result }}
        run: bash staging/plugin/scripts/tests/plant-check.sh --require-legs "$SHARD_RESULT"

      - name: Evaluate the union
        if: steps.decide.outputs.tier == 'full'
        run: bash staging/plugin/scripts/tests/plant-check.sh --union "${{ runner.temp }}/plant-shards"

      - name: Note plant registry union skipped
        if: steps.decide.outputs.tier != 'full'
        run: echo "::notice::plant registry skipped (tier=${{ steps.decide.outputs.tier }})"

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Internal links: file paths and #anchors, resolved offline. A broken relative
      # link or dead anchor fails the build.
      - name: Internal links (blocking)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: "--offline --include-fragments --exclude-path docs/superpowers --no-progress '**/*.md'"
          fail: true

      # External links: real HTTP(S) targets. Reported in the job summary but never block,
      # so a rate-limited or temporarily-down host does not turn the PR red.
      - name: External links (warning only)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        continue-on-error: true
        with:
          args: "--scheme https --scheme http --exclude-path docs/superpowers --no-progress '**/*.md'"
          fail: true
